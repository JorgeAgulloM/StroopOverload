name: CI

on:
  pull_request:
    branches: [develop, main]
  # Runs on the target branches too, so the merged result is checked and the caches that
  # pull requests read get written (see cache-read-only below).
  push:
    branches: [develop, main]
  workflow_dispatch:

# A new push to a pull request cancels the run still going for its previous commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs (tags can be moved); Dependabot keeps them current.
permissions:
  contents: read

jobs:
  android:
    name: Android (unit tests, lint, debug build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          # Pull requests only read the cache; runs on develop/main write it. The action's
          # default writes only on the repository's default branch, which is neither.
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # The real google-services.json is gitignored. The build only needs one that parses and
      # names the app's package: nothing in the unit tests talks to Firebase.
      - name: Use the placeholder google-services.json
        run: cp .github/ci/google-services.placeholder.json app/google-services.json

      # --continue: a failing test still lets lint and the build report their own problems.
      - name: Unit tests, lint and debug build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --continue

      - name: Upload the reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7

  functions:
    name: Cloud Functions (lint, build, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    env:
      FIREBASE_TOOLS_VERSION: 15.22.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # The Firestore emulator needs Java 21.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Cache the Firestore emulator
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ env.FIREBASE_TOOLS_VERSION }}
          restore-keys: firebase-emulators-

      - run: npm ci
      - run: npm install -g firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }}
      - run: npm run lint
      - run: npm run build

      # What `npm test` runs, but against a demo- project: the emulator then never looks for
      # the credentials of the real project, which CI doesn't have.
      - name: Tests (Firestore emulator)
        run: firebase emulators:exec --project demo-stroopoverload --only firestore "npx jest --ci"
